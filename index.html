<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LiteLearn AI</title>

    <!-- marked.js: converts Markdown text from AI responses into HTML for display -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Mermaid v10: renders mind map diagrams from Mermaid syntax returned by the backend -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

    <style>
        /* Global CSS variables — change --blue here to retheme the whole app */
        :root { --blue: #1a73e8; --bg: #f8f9fa; }

        /* Full-page flex layout: sidebar on left, main panel fills the rest */
        body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; background: #eef2f5; }

        /* Sidebar: fixed-width panel for upload and book selection */
        .sidebar { width: 280px; background: white; border-right: 1px solid #ddd; padding: 25px; overflow-y: auto; }

        /* Main panel: column layout — nav bar on top, content in middle, chat input at bottom */
        .main { flex: 1; display: flex; flex-direction: column; background: white; margin: 15px; border-radius: 12px; overflow: hidden; }

        /* Top navigation bar — switches between Chat / Flashcards / Mind Map / Quiz / Slides */
        .nav { height: 60px; border-bottom: 1px solid #eee; display: flex; padding: 0 20px; gap: 15px; align-items: center; }
        .nav-item { cursor: pointer; padding: 8px 15px; border-radius: 20px; font-weight: 600; color: #666; transition: 0.2s; }
        .nav-item.active { background: var(--blue); color: white; }

        /* Scrollable content area used by all tab panels */
        .container { flex: 1; overflow-y: auto; padding: 30px; }

        /* Chat input bar — pinned to bottom, only visible on Chat tab */
        .chat-zone { padding: 20px; border-top: 1px solid #eee; display: flex; gap: 10px; }

        /* Base styles for form elements */
        input, select, button { padding: 10px; border-radius: 8px; border: 1px solid #ddd; }
        button { background: var(--blue); color: white; border: none; font-weight: bold; cursor: pointer; }

        /* Card: used for chat bubbles and quiz questions — blue left border for visual grouping */
        .card { background: var(--bg); border-left: 5px solid var(--blue); padding: 15px; margin-bottom: 15px; border-radius: 8px; }

        /* Quiz option buttons — default white; turns green/red on answer */
        .opt     { padding: 10px; border: 1px solid #ddd; margin-top: 5px; border-radius: 5px; cursor: pointer; background: white; }
        .correct { background: #d4edda !important; border-color: #28a745 !important; }
        .wrong   { background: #f8d7da !important; border-color: #dc3545 !important; }

        /* ── Flip Card Styles ──────────────────────────────────────────────────
           Each card is a 3D container with two faces: front (term) and back (definition).
           perspective: 1000px creates the 3D depth effect.
           transform-style: preserve-3d makes the inner div exist in 3D space.
           When .flipped is toggled by a click, the inner div rotates 180° on Y-axis. */
        .flip-card  { width: 280px; height: 160px; perspective: 1000px; cursor: pointer; display: inline-block; }
        .flip-inner { position: relative; width: 100%; height: 100%; transition: transform 0.55s cubic-bezier(.4,2,.6,1); transform-style: preserve-3d; }
        .flip-card.flipped .flip-inner { transform: rotateY(180deg); }

        /* Both faces are absolutely stacked on top of each other.
           backface-visibility: hidden hides each face when it's rotated away from the viewer. */
        .flip-front, .flip-back {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            padding: 14px; box-sizing: border-box; text-align: center;
        }
        /* Front face: shows the term in red bold text */
        .flip-front { background: white; color: #cc0001; font-size: 16px; font-weight: bold; border: 1px solid #ddd; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        /* Back face: pre-rotated 180° so it appears correct when the card is flipped */
        .flip-back  { background: white; color: #333; font-size: 14px; line-height: 1.5; border: 2px solid #cc0001; transform: rotateY(180deg); }

        /* ── Mind Map Display ──────────────────────────────────────────────────
           Scrollable box to hold the Mermaid SVG diagram.
           overflow-x: auto allows wide diagrams to scroll horizontally. */
        #mindmap-display {
            background: white; padding: 20px; border: 1px dashed #ccc; border-radius: 10px;
            min-height: 300px; overflow-x: auto; overflow-y: auto; display: flex;
            justify-content: center; align-items: flex-start; margin-top: 20px;
        }
        /* Ensure the rendered SVG fits within the container width */
        #mindmap-display svg { max-width: 100%; height: auto; }

        /* Fallback raw code box — shown when Mermaid fails to parse the diagram */
        #mindmap-raw {
            display: none; background: #f4f4f4; border: 1px solid #ccc; border-radius: 8px;
            padding: 15px; margin-top: 15px; font-family: monospace; font-size: 13px;
            white-space: pre-wrap; text-align: left;
        }

        /* Sidebar label styling and full-width inputs */
        .sidebar label { font-size: 12px; color: #888; display: block; margin-top: 14px; margin-bottom: 4px; }
        .sidebar select, .sidebar input[type=file] { width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>

<!-- ── SIDEBAR ──────────────────────────────────────────────────────────────────────
     Contains: PDF upload trigger, textbook selector dropdown -->
<div class="sidebar">
    <h2 style="color:var(--blue);">🎓 LiteLearn</h2>

    <label>📄 Upload PDF</label>
    <!-- Triggers upload() immediately when a file is chosen — no submit button needed -->
    <input type="file" id="f" accept=".pdf" onchange="upload()">

    <label>📚 Select Textbook</label>
    <!-- Populated dynamically by loadBooks() on page load -->
    <select id="books"></select>
</div>

<!-- ── MAIN PANEL ───────────────────────────────────────────────────────────────────
     Holds the nav bar, all tab content panels, and the chat input bar -->
<div class="main">

    <!-- Tab navigation — each item calls setTab() to show/hide the right panel -->
    <div class="nav">
        <div class="nav-item active" onclick="setTab('chat')">Chat</div>
        <div class="nav-item" onclick="setTab('cards')">Flashcards</div>
        <div class="nav-item" onclick="setTab('mindmap')">Mind Map</div>
        <div class="nav-item" onclick="setTab('quiz')">Quiz</div>
        <div class="nav-item" onclick="setTab('slides')">Slides</div>
    </div>

    <!-- Chat panel: AI responses are appended here as card divs -->
    <div class="container" id="chat-box"></div>

    <!-- Flashcards panel: number input + generate button + card grid output -->
    <div class="container" id="cards-box" style="display:none;">
        <input type="number" id="card-count" value="5" min="1" max="15">
        <button onclick="genCards()">Generate Cards</button>
        <!-- Flip cards are injected here by genCards() -->
        <div id="cards-list" style="margin-top:20px;"></div>
    </div>

    <!-- Mind Map panel: generates a Mermaid flowchart from the last chat answer -->
    <div class="container" id="mindmap-box" style="display:none; text-align:center;">
        <p>Generate a visual diagram based on your last chat topic.</p>
        <button onclick="genMindMap()">Generate Visual Diagram</button>
        <!-- SVG diagram is injected here; raw code fallback shown on parse error -->
        <div id="mindmap-display"><p style="color:#888;">Diagram will appear here...</p></div>
        <div id="mindmap-raw"></div>
    </div>

    <!-- Quiz panel: difficulty selector + MCQ questions rendered one at a time -->
    <div class="container" id="quiz-box" style="display:none;">
        <input type="number" id="quiz-count" value="3" min="1" max="15">
        <select id="quiz-level">
            <option>Easy</option>
            <option selected>Medium</option>
            <option>Hard</option>
        </select>
        <button onclick="genQuiz()">Start Quiz</button>
        <!-- Each question is rendered here by showQuestion() -->
        <div id="quiz-display" style="margin-top:20px;"></div>
    </div>

    <!-- Slides panel: topic + name input, downloads a .pptx file on click -->
    <div class="container" id="slides-box" style="display:none; text-align:center;">
        <input type="text" id="slide-topic" placeholder="Slide Topic">
        <input type="text" id="student-name" placeholder="Presented By">
        <button onclick="downloadSlides()">Generate PPTX</button>
        <p id="slide-status" style="margin-top:10px;"></p>
    </div>

    <!-- Chat input bar — hidden on non-chat tabs via setTab() -->
    <div class="chat-zone" id="input-area">
        <input type="text" id="q" style="flex:1" placeholder="Ask anything (e.g., explain for 5 marks)">
        <button onclick="sendChat()">Send</button>
    </div>
</div>

<script>
    // Base URL for all API calls — change this if backend runs on a different port
    const API = "http://localhost:8000/api";

    // Quiz state: array of questions, current index, running score
    let qData = [], curIdx = 0, score = 0;

    // Initialize Mermaid v10 — startOnLoad:false means we call render() manually
    // securityLevel:'loose' is required for dynamic rendering outside a static page
    mermaid.initialize({
        startOnLoad: false,
        theme: 'neutral',
        flowchart: { useMaxWidth: true, htmlLabels: true, curve: 'basis' },
        securityLevel: 'loose'
    });

    // Prevent number inputs from going out of 1–15 range as the user types
    function clampInput() {
        let val = parseInt(this.value);
        if (val < 1) this.value = 1;
        if (val > 15) this.value = 15;
    }
    document.getElementById('quiz-count').addEventListener('input', clampInput);
    document.getElementById('card-count').addEventListener('input', clampInput);

    // Upload selected PDF to backend, then refresh the textbook dropdown
    async function upload() {
        const fd = new FormData();
        fd.append('file', document.getElementById('f').files[0]);
        await fetch(`${API}/pdf/upload`, { method: 'POST', body: fd });
        loadBooks();
    }

    // Fetch all uploaded textbooks and populate the sidebar dropdown
    async function loadBooks() {
        const r = await fetch(`${API}/textbooks`);
        const b = await r.json();
        document.getElementById('books').innerHTML = b.map(x =>
            `<option value="${x.id}">${x.filename}</option>`).join('');
    }

    // Tab switching — shows the selected panel and hides all others
    // Also hides the chat input bar on non-chat tabs
    function setTab(tab) {
        const tabs = ['chat','cards','mindmap','quiz','slides'];
        document.querySelectorAll('.nav-item').forEach((el, i) =>
            el.classList.toggle('active', tabs[i] === tab));
        ['chat-box','cards-box','mindmap-box','quiz-box','slides-box'].forEach(id => {
            document.getElementById(id).style.display = id.startsWith(tab) ? 'block' : 'none';
        });
        document.getElementById('input-area').style.display = tab === 'chat' ? 'flex' : 'none';
    }

    // Send student's question to the backend and stream the response token by token
    // Each token is decoded and appended to the raw string, then re-parsed as Markdown
    async function sendChat() {
        const bookId = document.getElementById('books').value;
        const q = document.getElementById('q').value.trim();
        if (!q) return;

        const box = document.getElementById('chat-box');
        // Show the student's question immediately as a grey card
        box.innerHTML += `<div class="card" style="background:#eef2f5"><b>You:</b> ${q}</div>`;
        document.getElementById('q').value = '';

        // Create a unique ID per message so multiple streaming responses don't collide
        const uid = 'stream-' + Date.now();
        const aiCard = document.createElement('div');
        aiCard.className = 'card';
        aiCard.innerHTML = `<b>🎓 LiteLearn:</b><br><span id="${uid}">⏳ Thinking...</span>`;
        box.appendChild(aiCard);
        box.scrollTop = box.scrollHeight;

        try {
            const res = await fetch(`${API}/chat`, {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ textbook_id: bookId, question: q })
            });
            // Read the streaming response chunk by chunk using the ReadableStream API
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let raw = '';
            const out = document.getElementById(uid);
            out.textContent = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                raw += decoder.decode(value, { stream: true });
                // Re-render as Markdown; also bold any heading-style lines (e.g. "Build-time Metadata:")
                let html = marked.parse(raw);
                // Bold standalone lines that end with ":" — these are subheadings from the notes
                html = html.replace(/<p>([^<]{3,60}:)<\/p>/g, '<p><strong>$1</strong></p>');
                out.innerHTML = html;
                box.scrollTop = box.scrollHeight;
            }
        } catch(e) {
            document.getElementById(uid).textContent = '❌ Error connecting to server.';
        }
    }

    // Request a Mermaid flowchart from the backend based on the last chat answer
    // Uses mermaid.render() (v10 API) to convert Mermaid syntax into an inline SVG
    async function genMindMap() {
        const id = document.getElementById('books').value;
        const display = document.getElementById('mindmap-display');
        const rawBox  = document.getElementById('mindmap-raw');
        display.innerHTML = "<p>⏳ AI is drawing the diagram...</p>";
        rawBox.style.display = 'none';
        try {
            const res = await fetch(`${API}/generate-mindmap`, {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ textbook_id: id })
            });
            const j = await res.json();
            if (j.error) { display.innerHTML = `<p style="color:red;">${j.error}</p>`; return; }
            try {
                // mermaid.render() takes a unique element ID + Mermaid syntax string
                // and returns the rendered SVG string — inject it directly into the DOM
                const { svg } = await mermaid.render('mermaid-' + Date.now(), j.data);
                display.innerHTML = svg;
            } catch(e) {
                // If Mermaid can't parse the AI's output, show the raw code as fallback
                display.innerHTML = `<p style="color:orange;">⚠️ Diagram syntax error. Showing raw code below.</p>`;
                rawBox.style.display = 'block'; rawBox.innerText = j.data;
            }
        } catch(e) { display.innerHTML = `<p style="color:red;">Error connecting to server.</p>`; }
    }

    // Fetch flashcards from the backend and render them as interactive flip cards
    // Each card element gets a click listener that toggles the .flipped CSS class
    async function genCards() {
        const id  = document.getElementById('books').value;
        const num = parseInt(document.getElementById('card-count').value);
        const box = document.getElementById('cards-list');
        box.innerHTML = '<p style="color:#888">⏳ Generating cards...</p>';

        const res = await fetch(`${API}/generate-cards`, {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ textbook_id: id, count: num })
        });
        const j = await res.json();
        if (j.error) { box.innerHTML = `<p style="color:red">${j.error}</p>`; return; }
        const cards = j.cards || [];
        if (!cards.length) { box.innerHTML = '<p style="color:red">No cards generated. Try again.</p>'; return; }

        box.innerHTML = '';
        cards.forEach(obj => {
            const fc = document.createElement('div');
            fc.className = 'flip-card';
            fc.style.cssText = 'display:inline-block; margin:8px; vertical-align:top;';
            // Two faces inside flip-inner: front shows term, back shows definition
            fc.innerHTML = `<div class="flip-inner">
                <div class="flip-front">${obj.t}</div>
                <div class="flip-back">${obj.f}</div>
            </div>`;
            // Click toggles .flipped — CSS handles the 3D rotation automatically
            fc.addEventListener('click', () => fc.classList.toggle('flipped'));
            box.appendChild(fc);
        });
    }

    // Fetch MCQ questions from backend and start the quiz
    // Questions are stored globally in qData and shown one at a time by showQuestion()
    async function genQuiz() {
        const id    = document.getElementById('books').value;
        const num   = document.getElementById('quiz-count').value;
        const level = document.getElementById('quiz-level').value;
        document.getElementById('quiz-display').innerHTML = "⏳ Generating Quiz...";
        const r = await fetch(`${API}/generate-quiz`, {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ textbook_id: id, count: num, level: level })
        });
        const j = await r.json();
        // Reset quiz state: load new questions, reset index and score
        qData = j.data; curIdx = 0; score = 0; showQuestion();
    }

    // Stores the correct answer for the current question
    // Used in verify() to compare without passing text through inline onclick attributes
    let currentCorrect = '';

    // Renders the current question and its 4 options into the quiz display box
    // Stores option text in data-val attributes to avoid quote-escaping issues
    function showQuestion() {
        const box = document.getElementById('quiz-display');
        if (curIdx >= qData.length) {
            // All questions answered — show final score
            box.innerHTML = `<h3>✅ Quiz Finished! Score: ${score}/${qData.length}</h3>`;
            return;
        }
        const itm = qData[curIdx];
        currentCorrect = (itm.c || '').trim();
        let html = `<div class="card"><h3 style="margin-bottom:14px">${itm.q}</h3>`;
        itm.o.forEach((o, idx) => {
            html += `<div class="opt" data-idx="${idx}" onclick="verify(this)"><b>${String.fromCharCode(65+idx)})</b> ${o}</div>`;
        });
        html += '</div>';
        box.innerHTML = html;
        // Assign option text to data-val after rendering so special characters are safe
        document.querySelectorAll('.opt').forEach((el, i) => {
            el.dataset.val = itm.o[i] ? itm.o[i].trim() : '';
        });
    }

    // Called when a student clicks an answer option
    // Disables all options, highlights correct in green and wrong in red, then advances
    function verify(el) {
        // Lock all options immediately to prevent double-clicking
        document.querySelectorAll('.opt').forEach(o => { o.style.pointerEvents = 'none'; o.onclick = null; });
        const norm = s => s.trim().toLowerCase();
        const correct = norm(currentCorrect);
        let isRight = false;
        document.querySelectorAll('.opt').forEach(o => {
            if (norm(o.dataset.val || '') === correct) {
                o.classList.add('correct'); // Always highlight the correct answer
                if (o === el) isRight = true;
            } else if (o === el) {
                o.classList.add('wrong');   // Only mark wrong if student picked it
            }
        });
        if (isRight) score++;
        // Wait 2.5 seconds so student can see feedback before moving to next question
        setTimeout(() => { curIdx++; showQuestion(); }, 2500);
    }

    // Request slide generation from backend and trigger a browser download of the .pptx file
    // Uses Blob URL trick to download binary file without a visible link
    async function downloadSlides() {
        const id    = document.getElementById('books').value;
        const topic = document.getElementById('slide-topic').value;
        const name  = document.getElementById('student-name').value;
        if (!id || !topic) return alert("Select a book and enter a topic");
        document.getElementById('slide-status').innerText = "⏳ Building slides...";
        const response = await fetch(`${API}/generate-slides`, {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ textbook_id: id, topic: topic, student_name: name })
        });
        // Convert response to a Blob, create a temporary download URL, auto-click it
        const blob = await response.blob();
        const a = document.createElement('a');
        a.href = window.URL.createObjectURL(blob);
        a.download = `${topic}.pptx`;
        a.click();
        document.getElementById('slide-status').innerText = "✅ PPTX Ready!";
    }

    // Load the textbook list as soon as the page finishes loading
    window.onload = loadBooks;
</script>
</body>
</html>
